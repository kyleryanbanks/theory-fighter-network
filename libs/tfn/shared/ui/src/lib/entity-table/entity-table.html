<div
  class="entity-table__viewport"
  role="region"
  tabindex="0"
  [attr.aria-label]="'Scrollable table: ' + ariaLabel()"
>
  <table
    mat-table
    matSort
    [dataSource]="sortedRows()"
    [trackBy]="trackRow"
    [attr.aria-label]="ariaLabel()"
    (matSortChange)="onSortChange($event)"
  >
    @for (column of columns(); track column.id) {
    <ng-container [matColumnDef]="column.id" [sticky]="column.sticky ?? false">
      <th
        mat-header-cell
        *matHeaderCellDef
        [mat-sort-header]="column.id"
        [disabled]="!isSortable(column)"
        [class.entity-table__priority]="column.mobilePriority"
      >
        {{ column.label }}
      </th>
      <td
        mat-cell
        *matCellDef="let entity"
        [class.entity-table__priority]="column.mobilePriority"
      >
        @if (column.cellTemplate; as cellTemplate) {
        <ng-container
          [ngTemplateOutlet]="cellTemplate"
          [ngTemplateOutletContext]="{
                $implicit: entity,
                value: getValue(entity, column),
              }"
        />
        } @else { {{ displayValue(entity, column) }} }
      </td>
    </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
    <tr mat-row *matRowDef="let entity; columns: displayedColumns()"></tr>
    <tr class="entity-table__empty" *matNoDataRow>
      <td [attr.colspan]="columns().length">{{ emptyMessage() }}</td>
    </tr>
  </table>
</div>
