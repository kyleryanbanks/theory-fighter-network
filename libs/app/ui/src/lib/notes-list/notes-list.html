<div class="notes-list">
  <ul class="notes-items">
    @for (note of notes(); track note.id) {
      <li class="note-item" data-testid="note-item">
        <p class="note-text">{{ note.text }}</p>
        <div class="note-actions">
          @if (note.promotedToKey) {
            <span class="note-promoted" data-testid="promoted-indicator">
              Promoted
            </span>
          } @else if (!notAddressable()) {
            @if (addressUrl(); as urlResolver) {
              <a
                matButton
                type="button"
                data-testid="address-note"
                [routerLink]="urlResolver(note)"
                [attr.aria-label]="addressLabel()"
                [attr.title]="addressLabel()"
              >
                Address
              </a>
            } @else {
              <button
                matButton
                type="button"
                data-testid="address-note"
                [attr.aria-label]="addressLabel()"
                [attr.title]="addressLabel()"
                (click)="addressNote(note)"
              >
                Address
              </button>
            }
          }
          <button
            class="note-delete"
            matButton
            type="button"
            data-testid="remove-note"
            [attr.aria-label]="'Delete note ' + note.id"
            (click)="removeNote(note.id)"
          >
            Delete
          </button>
        </div>
      </li>
    } @empty {
      <p class="notes-empty">No notes yet.</p>
    }
  </ul>

  <div class="notes-draft">
    <mat-form-field appearance="outline" class="notes-input">
      <mat-label>Add a note</mat-label>
      <textarea
        matInput
        rows="3"
        data-testid="note-text"
        [value]="draftText()"
        (input)="draftText.set($any($event.target).value)"
      ></textarea>
    </mat-form-field>
    <button
      matButton="filled"
      type="button"
      data-testid="add-note"
      (click)="addNote()"
    >
      Add note
    </button>
  </div>
</div>
