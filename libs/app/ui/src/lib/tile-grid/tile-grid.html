<div class="tile-grid">
  @for (tile of tiles; track tile.key) {
    <div class="tile-wrapper">
      @if (maxSelections && selectionPosition(tile); as pos) {
        <span class="tile-selection-badge">{{ pos }}</span>
      }
      <button
        type="button"
        class="tile-grid-button"
        [ngClass]="{
          'tile-grid-button--selected': maxSelections ? isSelected(tile) : tile.value === true,
          'tile-grid-button--selected-badged': !!(maxSelections && selectionPosition(tile)),
          'tile-grid-button--menu-open': isMenuOpen(tile.key),
          'tile-grid-button--disabled': isDisabled(tile),
          'tile-grid-button--tinted': !!getChoiceColor(tile)
        }"
        [style.--tile-color]="getChoiceColor(tile) || null"
        (click)="onTileClick(tile)"
        [disabled]="isDisabled(tile)"
        [attr.aria-haspopup]="tile.choices ? 'menu' : null"
        [attr.aria-expanded]="isMenuOpen(tile.key)"
      >
        <span class="tile-label">{{ tile.label }}</span>
        @if (getSelectedChoiceLabel(tile)) {
          <span class="tile-tag"
            [style.background]="getChoiceColor(tile) || null"
            [style.color]="getChoiceColor(tile) ? '#0a1a15' : null">
            {{ getSelectedChoiceLabel(tile) }}
          </span>
        }
        @if (tile.tags && tile.tags.length > 0) {
          <div class="tile-tags">
            @for (tag of tile.tags; track $index) {
              <span class="tile-tag-badge" [ngClass]="tag.color ? 'tile-tag-badge--' + tag.color : ''">
                {{ tag.label }}
              </span>
            }
          </div>
        }
      </button>
      @if (tile.choices && isMenuOpen(tile.key)) {
        <div class="tile-choice-menu" role="menu">
          @for (entry of getChoiceEntries(tile); track entry[0]) {
            <button
              type="button"
              class="tile-choice-button"
              [style.--choice-color]="entry[1].color || null"
              [class.tile-choice-button--colored]="!!entry[1].color"
              (click)="onChoiceSelected(tile, entry[0])"
              role="menuitem"
            >
              {{ entry[1].label }}
            </button>
          }
        </div>
      }
    </div>
  }
</div>
