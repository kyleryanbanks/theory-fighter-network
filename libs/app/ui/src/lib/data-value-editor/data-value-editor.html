<section class="data-value-editor" [attr.aria-label]="modeLabel() + ' value'">
  <div class="data-value-editor__header">
    <strong>{{ modeLabel() }}</strong>
    <button
      matIconButton
      type="button"
      data-testid="swap-mode"
      [attr.aria-label]="switchLabel()"
      [attr.title]="switchLabel()"
      (click)="toggleMode()"
    >
      <span aria-hidden="true">&#8646;</span>
    </button>
  </div>

  @if (mode() === 'relative') {
    <div class="data-value-editor__relative">
      <mat-form-field appearance="outline" class="data-value-editor__relative-value">
        <input
          matInput
          data-testid="relative-value"
          aria-label="Relative value"
          type="number"
          min="0"
          max="100"
          step="1"
          [value]="relativeValue()"
          (input)="updateRelativeNumber($event)"
        />
      </mat-form-field>
      <mat-slider min="0" max="100" step="1" discrete>
        <input
          matSliderThumb
          type="range"
          [value]="relativeValue()"
          [attr.aria-label]="'Relative value, ' + relativeValue() + ' percent'"
          (input)="updateRelative($event)"
        />
      </mat-slider>
    </div>
  } @else {
    <mat-form-field appearance="outline">
      <mat-label>Exact value</mat-label>
      <input matInput type="number" [value]="exactValue()" (input)="updateExact($event)" />
    </mat-form-field>
  }
</section>
