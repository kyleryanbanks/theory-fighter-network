@if (entity(); as currentEntity) {
  <section aria-labelledby="entity-detail-heading">
    <a class="back-link" [routerLink]="backRoute()">Back to {{ entityTypeLabel() }} list</a>
    <h3 id="entity-detail-heading">{{ title() }}</h3>
    <p class="entity-key">{{ entityKey }}</p>

    @if (metadata(); as entityMetadata) {
      <tfn-expansion-panel header="Notes">
        <tfn-entity-notes
          [entityType]="entityType"
          [entityKey]="entityKey"
          [notes]="entityMetadata.meta.notes || []"
          [notAddressable]="true"
        />
      </tfn-expansion-panel>
    }

    <tfn-expansion-panel header="Complete data" subheader="All stored fields for this entity">
      <pre>{{ currentEntity | json }}</pre>
    </tfn-expansion-panel>

    @if (metadata(); as entityMetadata) {
      <tfn-expansion-panel header="Metadata">
        <tfn-entity-metadata [metadata]="entityMetadata.meta" />
      </tfn-expansion-panel>
    }
  </section>
} @else {
  <p class="empty-state">{{ entityTypeLabel() }} not found.</p>
}
