@if (sequence(); as currentSequence) {
  <tfn-entity-detail-shell
    title="Sequence"
    [entityKey]="currentSequence.semanticKey"
    backLabel="Back to Sequence list"
    [backLink]="['/sequences']"
    [metadata]="currentSequence.meta"
  >
    <tfn-entity-notes detail-notes entityType="sequence" [entityKey]="currentSequence.semanticKey" [notes]="currentSequence.meta && currentSequence.meta.notes || []" [notAddressable]="true" />
    <tfn-expansion-panel header="Sequence data" subheader="Ordered Move steps">
      <pre>{{ currentSequence | json }}</pre>
    </tfn-expansion-panel>
  </tfn-entity-detail-shell>
} @else {
  <p class="empty-state">Sequence not found.</p>
}
