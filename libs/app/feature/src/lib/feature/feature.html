<main>
	<h1>Theory Fighter Network</h1>
	<div class="guide-toolbar" data-testid="guide-toolbar">
		<div class="guide-status">
			<p data-testid="workspace-key">
				Guide game: {{ facade.workspace()?.guide?.gameKey ?? 'none' }}
			</p>
			<p data-testid="busy-status">
				Busy: {{ facade.isBusy() ? 'yes' : 'no' }}
			</p>
		</div>

		<div class="guide-actions">
			<label class="file-action">
				Load .tfn
				<input
					class="visually-hidden"
					type="file"
					accept=".tfn"
					data-testid="import-archive"
					(change)="onTfnSelected($event)"
				/>
			</label>
			<button
				data-testid="export-archive"
				[disabled]="!facade.hasWorkspace()"
				(click)="saveTfn()"
			>
				Save .tfn
			</button>
		</div>
	</div>

	<tfn-game-root />

	<tfn-ui></tfn-ui>
</main>
