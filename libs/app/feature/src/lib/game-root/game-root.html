<section aria-labelledby="game-root-heading">
	<h2 id="game-root-heading">Game</h2>
	<form (submit)="$event.preventDefault(); createWorkspace()">
		<label>
			Game name
			<input
				data-testid="game-name"
				[value]="gameName()"
				[disabled]="facade.workspace()"
				(input)="updateGameName($event)"
			/>
		</label>
		<label>
			Version
			<input
				data-testid="game-version"
				[value]="gameVersion()"
				[disabled]="facade.workspace()"
				(input)="updateGameVersion($event)"
			/>
		</label>
		<label>
			Frame rate
			<input
				type="number"
				min="1"
				data-testid="frame-rate"
				[value]="frameRate()"
				(input)="updateFrameRate($event)"
			/>
		</label>
		<label>
			Team size
			<input
				type="number"
				min="1"
				data-testid="team-size"
				[value]="teamSize()"
				(input)="updateTeamSize($event)"
			/>
		</label>
		<label>
			<input
				type="checkbox"
				[checked]="is3d()"
				(change)="updateIs3d($event)"
			/>
			3D game
		</label>
		<button type="submit" data-testid="create-workspace">
			Create Workspace
		</button>
		<button
			type="button"
			data-testid="update-game"
			[disabled]="!facade.workspace()"
			(click)="updateActiveGame()"
		>
			Update Game
		</button>
	</form>
</section>
