@if (move(); as currentMove) {
  <section aria-labelledby="move-detail-heading">
    <h3 id="move-detail-heading">{{ currentMove.name }}</h3>
    <p class="entity-key">{{ currentMove.semanticKey }}</p>

    <tfn-expansion-panel header="Notes">
      <tfn-entity-notes
        entityType="move"
        [entityKey]="currentMove.semanticKey"
        [notes]="currentMove.meta && currentMove.meta.notes || []"
        [notAddressable]="true"
      />
    </tfn-expansion-panel>
    <tfn-expansion-panel header="Move data" subheader="Resolved effective values">
      <pre>{{ currentMove | json }}</pre>
    </tfn-expansion-panel>
    <tfn-expansion-panel header="Metadata">
      <tfn-entity-metadata [metadata]="currentMove.meta" />
    </tfn-expansion-panel>
  </section>
} @else {
  <p class="empty-state">Move not found.</p>
}
