<div class="cancel-groups-editor">
  <div class="editor-header">
    <h3>Cancel Groups</h3>
    <button
      matButton="outlined"
      type="button"
      class="create-cancel-group-button"
      (click)="onStartCreate()"
      [disabled]="isCreating()"
    >
      New Group
    </button>
  </div>

  @if (isCreating()) {
    <div class="create-form">
      <div class="form-row">
        <input
          type="text"
          class="new-group-name-input"
          [(ngModel)]="newGroupName"
          placeholder="Group name"
          (keyup.enter)="onConfirmCreate()"
        />
      </div>
      <div class="form-actions">
        <button
          matButton="filled"
          type="button"
          class="confirm-create-button"
          (click)="onConfirmCreate()"
        >
          Create
        </button>
        <button
          matButton="outlined"
          type="button"
          (click)="onCancelCreate()"
        >
          Cancel
        </button>
      </div>
    </div>
  }

  <div class="groups-list">
    @if (cancelGroups().length === 0) {
      <p class="empty-state">No cancel groups yet.</p>
    } @else {
      @for (group of cancelGroups(); track group.name) {
        <div class="cancel-group-item">
          <div class="group-header">
            @if (isRenaming(group.name)) {
              <div class="rename-form">
                <input
                  type="text"
                  class="cancel-group-rename-input"
                  [(ngModel)]="newGroupName"
                  (keyup.enter)="onConfirmRename()"
                />
                <button
                  matButton="filled"
                  type="button"
                  class="confirm-rename-button"
                  (click)="onConfirmRename()"
                >
                  Confirm
                </button>
                <button
                  matButton="outlined"
                  type="button"
                  (click)="onCancelRename()"
                >
                  Cancel
                </button>
              </div>
            } @else {
              <span class="group-name">{{ group.name }}</span>
              <span class="move-count">{{ group.moveKeys.length }} moves</span>
              <button
                matButton="outlined"
                type="button"
                class="cancel-group-rename-button"
                (click)="onStartRename(group.name)"
                [disabled]="editingGroupName() !== null"
              >
                Rename
              </button>
              <button
                matButton="outlined"
                type="button"
                class="cancel-group-edit-button"
                (click)="onEditGroup(group.name)"
                [disabled]="editingGroupName() !== null && editingGroupName() !== group.name"
              >
                {{ isEditing(group.name) ? 'Close' : 'Edit' }}
              </button>
              <tfn-delete-button
                [ariaLabel]="'Delete cancel group ' + group.name"
                class="cancel-group-delete-button"
                (delete)="onDeleteGroup(group.name)"
              />
            }
          </div>

          @if (isEditing(group.name)) {
            <div class="editor-content">
              <tfn-tile-grid
                [tiles]="moveTiles()"
                (update)="onTileUpdate($event)"
              />
              <div class="editor-actions">
                <button
                  matButton="filled"
                  type="button"
                  class="save-group-button"
                  (click)="onSaveGroup()"
                >
                  Save Changes
                </button>
                <button
                  matButton="outlined"
                  type="button"
                  (click)="onCancelEdit()"
                >
                  Cancel
                </button>
              </div>
            </div>
          }
        </div>
      }
    }
  </div>
</div>
